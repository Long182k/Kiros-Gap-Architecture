# GapAnalyzer CI/CD Pipeline
# Build, push to GHCR, and deploy to VPS

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BE_IMAGE: ghcr.io/long182k/gapanalyzer-backend
  FE_IMAGE: ghcr.io/long182k/gapanalyzer-frontend

jobs:
  # ============================================
  # Build & Push Docker Images
  # ============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Backend)
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BE_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          push: true
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Frontend)
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FE_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to VPS
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Copy docker-compose files
          scp docker-compose.yml $VPS_USER@$VPS_HOST:/opt/gapanalyzer/
          scp docker-compose.prod.yml $VPS_USER@$VPS_HOST:/opt/gapanalyzer/
          scp docker-compose.monitoring.yml $VPS_USER@$VPS_HOST:/opt/gapanalyzer/
          scp -r monitoring $VPS_USER@$VPS_HOST:/opt/gapanalyzer/
          
          # Deploy on VPS
          ssh $VPS_USER@$VPS_HOST "bash -s" << EOF
            set -e
            cd /opt/gapanalyzer
            
            # Set image environment variables
            export BE_IMAGE="${{ env.BE_IMAGE }}:latest"
            export FE_IMAGE="${{ env.FE_IMAGE }}:latest"
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            
            # Deploy with zero-downtime
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            # Optional: Deploy monitoring stack
            docker compose -f docker-compose.monitoring.yml up -d
            
            # Cleanup old images
            docker image prune -f
            
            # Health check with retries (using docker exec since ports aren't exposed to host)
            echo "⏳ Waiting for services to be healthy..."
            for i in 1 2 3 4 5; do
              echo "Health check attempt \$i/5..."
              sleep 15
              if docker exec gapanalyzer-backend node -e "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" 2>/dev/null; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ \$i -eq 5 ]; then
                echo "❌ Backend health check failed after 5 attempts"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backend --tail=50
                exit 1
              fi
            done
            
            # Check frontend through traefik
            if curl -sf http://localhost:80/ > /dev/null 2>&1; then
              echo "✅ Frontend is healthy!"
            else
              echo "⚠️ Frontend may still be starting..."
            fi
            
            echo "✅ Deployment successful!"
          EOF

      - name: Notify Success
        if: success()
        run: echo "🚀 Deployed to https://${{ secrets.VPS_HOST }}"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed!"
